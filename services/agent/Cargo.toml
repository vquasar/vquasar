[package]
name = "vquasar-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "vquasar host agent (local authority for one virtualization host)."

[[bin]]
name = "vquasar-agent"
path = "src/main.rs"

[dependencies]
vquasar-common.workspace = true
vquasar-model.workspace = true
vquasar-client.workspace = true
vquasar-proto.workspace = true

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic.workspace = true
rustls.workspace = true
prost.workspace = true
async-trait.workspace = true
clap.workspace = true
figment.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true

[dev-dependencies]
figment = { workspace = true, features = ["test"] }
tempfile = "3"

# Milestone 2 gRPC client harness for driving a running agent end-to-end.
[[example]]
name = "agent_client"
path = "examples/agent_client.rs"
