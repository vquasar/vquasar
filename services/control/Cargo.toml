[package]
name = "vquasar-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "vquasar control plane (public API, scheduling, desired state)."

[[bin]]
name = "vquasar-control"
path = "src/main.rs"

[dependencies]
vquasar-common.workspace = true
vquasar-model.workspace = true
vquasar-proto.workspace = true

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync", "fs", "io-util"] }
tokio-stream = "0.1"
axum = { workspace = true, features = ["ws"] }
axum-server.workspace = true
rustls.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
tower-http.workspace = true
tonic.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
sqlx.workspace = true

serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true

aes-gcm.workspace = true
base64.workspace = true
# Already built transitively via rustls; used directly for enrollment-token
# CSPRNG + SHA-256 hashing (design M16).
ring = "0.17"
ipnet.workspace = true

clap.workspace = true
figment.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"

[dev-dependencies]
figment = { workspace = true, features = ["test"] }
tempfile = "3"
