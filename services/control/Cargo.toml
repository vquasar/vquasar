[package]
name = "ch-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "ch-orchestrator control plane (public API, scheduling, desired state)."

[[bin]]
name = "ch-control"
path = "src/main.rs"

[dependencies]
ch-common.workspace = true
ch-model.workspace = true
ch-proto.workspace = true

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
axum.workspace = true
tower-http.workspace = true
tonic.workspace = true
sqlx.workspace = true

serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true

clap.workspace = true
figment.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true

[dev-dependencies]
figment = { workspace = true, features = ["test"] }
