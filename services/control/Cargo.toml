[package]
name = "ch-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "ch-orchestrator control plane (public API, scheduling, desired state)."

[[bin]]
name = "ch-control"
path = "src/main.rs"

[dependencies]
ch-common.workspace = true
ch-model.workspace = true
ch-proto.workspace = true

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
tokio-stream = "0.1"
axum = { workspace = true, features = ["ws"] }
axum-server.workspace = true
rustls.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
tower-http.workspace = true
tonic.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
sqlx.workspace = true

serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true

aes-gcm.workspace = true
base64.workspace = true

clap.workspace = true
figment.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true

[dev-dependencies]
figment = { workspace = true, features = ["test"] }
