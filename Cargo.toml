[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/model",
    "crates/ch-client",
    "crates/proto",
    "services/control",
    "services/agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/wrkode/ch-orchestrator"
authors = ["ch-orchestrator contributors"]

[workspace.dependencies]
# Internal crates
ch-common = { path = "crates/common" }
ch-model = { path = "crates/model" }
ch-client = { path = "crates/ch-client" }
ch-proto = { path = "crates/proto" }

# Async runtime
tokio = { version = "1", default-features = false }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors
thiserror = "2"
anyhow = "1"

# Identity & time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# Cryptography (design M12c: field encryption at rest)
aes-gcm = "0.10"
base64 = "0.22"

# IP address / subnet math (design M13a: IPAM)
ipnet = "2"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# CLI & configuration
clap = { version = "4", features = ["derive", "env"] }
figment = { version = "0.10", features = ["toml", "env"] }

# HTTP-over-UDS client (Cloud Hypervisor API)
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

# AuthN/RBAC (design M12b): OIDC JWT validation + JWKS/discovery fetch
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# gRPC (agent <-> control plane); `tls` enables rustls mTLS (design M12a)
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
tonic-build = "0.12"
protoc-bin-vendored = "3"

# Control-plane REST API + database
axum = "0.7"
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { version = "0.23", features = ["ring"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "fs"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "chrono",
    "uuid",
    "json",
] }

[profile.release]
lto = "thin"
codegen-units = 1
