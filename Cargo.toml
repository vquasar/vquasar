[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/model",
    "crates/ch-client",
    "services/control",
    "services/agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/wrkode/ch-orchestrator"
authors = ["ch-orchestrator contributors"]

[workspace.dependencies]
# Internal crates
ch-common = { path = "crates/common" }
ch-model = { path = "crates/model" }
ch-client = { path = "crates/ch-client" }

# Async runtime
tokio = { version = "1", default-features = false }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors
thiserror = "2"
anyhow = "1"

# Identity & time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# CLI & configuration
clap = { version = "4", features = ["derive", "env"] }
figment = { version = "0.10", features = ["toml", "env"] }

# HTTP-over-UDS client (Cloud Hypervisor API)
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

[profile.release]
lto = "thin"
codegen-units = 1
