# cargo-deny configuration.
# Run with: cargo deny check
# See https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # rustls-pemfile is unmaintained. It reaches us only through axum-server
    # and tonic, and cargo-deny reports "no safe upgrade is available" — there
    # is nothing to act on until those crates move off it. Tracked rather than
    # silently tolerated: re-check when axum-server or tonic is next bumped.
    "RUSTSEC-2025-0134",
]

[licenses]
version = 2
# Permissive licenses acceptable for an Apache-2.0 project.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # webpki-roots (the Mozilla CA bundle, via reqwest/rustls) ships under
    # CDLA-Permissive-2.0 — a permissive data licence, compatible with an
    # Apache-2.0 project.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Allow the internal path crates to use wildcard-free workspace versions.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
