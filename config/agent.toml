# Example vquasar-agent configuration.
# Override any value with an environment variable, e.g.
#   VQUASAR_AGENT_AGENT__NAME=host-02

[agent]
name = "host-01"
control_plane = "http://10.0.0.10:9443"

[hypervisor]
binary = "/usr/bin/cloud-hypervisor"
runtime_dir = "/run/vquasar"
# Serial console target: "socket" (interactive console) or "file" (log only).
serial_mode = "socket"

[migration]
# Directory for live-migration sockets (design section 28).
socket_dir = "/var/lib/vquasar/migrations"

[network]
backend = "ovs"
bridge = "br-int"

[storage]
backend = "local"
path = "/var/lib/vquasar"

[logging]
level = "info"

# Mutual TLS to the control plane (design M12a). Absent => plaintext gRPC,
# which is only safe on a trusted lab network.
# [tls]
# ca   = "/etc/vquasar/tls/ca.crt"
# cert = "/etc/vquasar/tls/agent.crt"
# key  = "/etc/vquasar/tls/agent.key"
# Common Name the control plane's client certificate must carry. Chaining to
# the CA is not identity — every agent's certificate does too — so without this
# a compromised host could drive every other agent (design §30).
# control_cn = "control"
