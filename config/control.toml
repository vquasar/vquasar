# Example vquasar-control configuration.
# Override any value with an environment variable, e.g.
#   VQUASAR_CONTROL_SERVER__LISTEN=127.0.0.1:9000

[server]
listen = "0.0.0.0:8080"

[database]
url = "postgres://ch:ch@localhost/vquasar"
# TLS to PostgreSQL. Defaults to "require": the connection carries every secret
# the platform holds, so it is encrypted unless you say otherwise. "require"
# guarantees encryption but not the server's identity — set "verify-full" and a
# `ca` for that, which is what a real deployment should do. See
# docs/postgres-tls.md.
ssl_mode = "verify-full"
# ca   = "/etc/vquasar/certs/pg-ca.crt"
# cert = "/etc/vquasar/certs/pg-client.crt"   # optional client-cert auth
# key  = "/etc/vquasar/certs/pg-client.key"

[storage]
# Roots a caller-supplied disk/kernel/firmware/image path must sit under. The
# agent opens these files with privilege, so without confinement `vm:create` is
# a read primitive over the host filesystem (design §30).
allowed_paths = ["/var/lib/vquasar"]
# What to do about files in a pool whose owning row is gone — a deleted VM's
# cloud-init seed or system disk, a volume's file (#41). "report" (the default)
# says what is leaking and deletes nothing; "delete" reclaims; "off" does not
# look. Only names the platform itself writes are ever candidates.
# orphan_reclaim = "report"
# orphan_sweep_secs = 3600
# orphan_min_age_secs = 3600
# shared_volumes_dir seeds the `default` storage pool the first time this
# control plane starts (ADR-023), and is not read again afterwards: pools are
# resources, managed through /api/v1/storage-pools. Renaming or repointing the
# default pool there wins over whatever is written here.
# shared_volumes_dir = "/var/lib/vquasar/shared/volumes"

[network]
# How per-NIC policy is resolved (ADR-017). "legacy" = a NIC with no security
# groups is unfiltered, which is what deployed clusters do today. "enforced" =
# the network's default group is unioned with the NIC's own, so every NIC
# carries a policy. Migration 0017 seeds each network a permissive default, so
# switching does not change reachability — but it does move every NIC from no
# flows to conntrack flows, so it is an operator decision.
policy_mode = "legacy"
# Whether a filtered NIC's egress is default-deny (ADR-024). "allow" (the
# default) is today's behaviour: a guest may originate anything, and the API
# refuses to record an egress rule because it would do nothing. "enforced" means
# a guest may originate only what its groups allow — which is what keeps a
# compromised guest off the management underlay and other tenants' networks.
# Switching cuts every filtered guest off from anything not explicitly allowed,
# including DNS: do it with a window, and write the rules first.
egress_mode = "allow"
# Whether the VXLAN underlay is encrypted (M18b). Tunnels are cleartext by
# default: anyone on the underlay can read overlay traffic, and anyone who can
# reach UDP/4789 can inject frames into any VNI.
#
# Roll this out in two steps. "reserve" keeps tunnels cleartext but shrinks the
# guest MTU to leave room for ESP; re-seed or reboot the overlay VMs and verify.
# Only then switch to "ipsec". Going straight to "ipsec" blackholes every
# full-size packet on the overlay, because MTU is baked into cloud-init at seed
# time and running VMs never pick up the new value.
overlay_encryption = "none"
# MTU of the host link the tunnels traverse; the guest MTU is derived from it.
underlay_mtu = 1500
# ESP wrapped in UDP for NAT traversal costs a further 8 bytes.
overlay_nat_traversal = false

# 802.1Q tags a `vlan` network may use, e.g. "100-200,300". Empty = none: a tag
# must match what the physical switch trunks, so it is stated, not guessed.
provider_vlans = ""
# Uplinks a provider/vlan network may attach to.
physical_networks = ["default"]
# VXLAN VNI range the control plane allocates from; below the start is left to
# hand-configured and pre-existing overlays.
vni_start = 4096
vni_end = 16777215
# How long a released VNI is withheld before reuse — long enough for hosts to
# tear down the overlay bridge and its tunnel mesh (ADR-016).
segment_quarantine_secs = 3600

[grpc]
listen = "0.0.0.0:9443"

[reconcile]
# How often the controllers poll agents and reconcile VMs, in seconds.
interval_secs = 5

[logging]
level = "info"
