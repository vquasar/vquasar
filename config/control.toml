# Example vquasar-control configuration.
# Override any value with an environment variable, e.g.
#   VQUASAR_CONTROL_SERVER__LISTEN=127.0.0.1:9000

[server]
listen = "0.0.0.0:8080"

[database]
url = "postgres://ch:ch@localhost/vquasar"
# TLS to PostgreSQL. Unset ⇒ "prefer": TLS if the server offers it, plaintext
# otherwise, with no error. Set verify-full (and `ca` for a private CA) to make
# an unencrypted or unverified connection a startup failure. See
# docs/postgres-tls.md.
# ssl_mode = "verify-full"
# ca   = "/etc/vquasar/certs/pg-ca.crt"
# cert = "/etc/vquasar/certs/pg-client.crt"   # optional client-cert auth
# key  = "/etc/vquasar/certs/pg-client.key"

[storage]
# Roots a caller-supplied disk/kernel/firmware/image path must sit under. The
# agent opens these files with privilege, so without confinement `vm:create` is
# a read primitive over the host filesystem (design §30).
allowed_paths = ["/var/lib/vquasar"]

[network]
# How per-NIC policy is resolved (ADR-017). "legacy" = a NIC with no security
# groups is unfiltered, which is what deployed clusters do today. "enforced" =
# the network's default group is unioned with the NIC's own, so every NIC
# carries a policy. Migration 0017 seeds each network a permissive default, so
# switching does not change reachability — but it does move every NIC from no
# flows to conntrack flows, so it is an operator decision.
policy_mode = "legacy"
# 802.1Q tags a `vlan` network may use, e.g. "100-200,300". Empty = none: a tag
# must match what the physical switch trunks, so it is stated, not guessed.
provider_vlans = ""
# Uplinks a provider/vlan network may attach to.
physical_networks = ["default"]
# VXLAN VNI range the control plane allocates from; below the start is left to
# hand-configured and pre-existing overlays.
vni_start = 4096
vni_end = 16777215
# How long a released VNI is withheld before reuse — long enough for hosts to
# tear down the overlay bridge and its tunnel mesh (ADR-016).
segment_quarantine_secs = 3600

[grpc]
listen = "0.0.0.0:9443"

[reconcile]
# How often the controllers poll agents and reconcile VMs, in seconds.
interval_secs = 5

[logging]
level = "info"
