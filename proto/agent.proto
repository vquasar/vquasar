// vquasar host-agent gRPC protocol (design document, section 12).
//
// NOTE: This schema is a forward-looking artifact for Milestone 2. It is not
// yet wired into the Cargo build (tonic/prost are not workspace dependencies in
// Milestone 0). It documents the initial control-plane <-> agent contract so
// the interface can be reviewed before implementation. This API must never be
// exposed publicly (section 12); the public surface is the REST API in
// vquasar-control.

syntax = "proto3";

package vquasar.agent.v1;

// The host agent runs once per virtualization host and is the local authority
// for that host.
service HostAgent {
  rpc GetHostInfo(GetHostInfoRequest) returns (GetHostInfoResponse);

  rpc GetVm(GetVmRequest) returns (GetVmResponse);
  rpc ListVms(ListVmsRequest) returns (ListVmsResponse);

  // Live resource metrics for one VM (design M15a).
  rpc GetVmMetrics(GetVmMetricsRequest) returns (VmMetricsResponse);

  // Reconcile a VM towards the desired spec (idempotent, section 22).
  rpc EnsureVm(EnsureVmRequest) returns (EnsureVmResponse);

  rpc StartVm(StartVmRequest) returns (OperationResponse);
  rpc StopVm(StopVmRequest) returns (OperationResponse);
  rpc DeleteVm(DeleteVmRequest) returns (OperationResponse);

  // Bidirectional serial console (design document, section 25). The first
  // client message selects the VM by id; subsequent messages carry input
  // (keystrokes). Server messages stream serial output.
  rpc VmConsole(stream ConsoleClientMessage) returns (stream ConsoleServerMessage);

  // Live migration (design document, section 28). The control plane
  // orchestrates: PrepareReceive on the destination, SendMigration on the
  // source, then FinalizeReceive (destination) + DiscardVm (source).
  rpc PrepareReceive(PrepareReceiveRequest) returns (PrepareReceiveResponse);
  rpc SendMigration(SendMigrationRequest) returns (OperationResponse);
  rpc FinalizeReceive(FinalizeReceiveRequest) returns (EnsureVmResponse);
  rpc DiscardVm(DiscardVmRequest) returns (OperationResponse);
}

message PrepareReceiveRequest {
  string vm_id = 1;
  string name = 2;
  bytes spec_json = 3;
}
message PrepareReceiveResponse {
  // The URL the source should send to (e.g. unix:/path or tcp:host:port).
  string migration_url = 1;
}

message SendMigrationRequest {
  string vm_id = 1;
  string destination_url = 2;
}

message FinalizeReceiveRequest { string vm_id = 1; }
message DiscardVmRequest { string vm_id = 1; }

message ConsoleClientMessage {
  // Set on the first message only.
  string vm_id = 1;
  // Input bytes to write to the guest serial port.
  bytes input = 2;
}

message ConsoleServerMessage {
  // Serial output bytes from the guest.
  bytes output = 1;
}

// ---- Host ----------------------------------------------------------------

message GetHostInfoRequest {}

message GetHostInfoResponse {
  string host_id = 1;
  string hostname = 2;
  string architecture = 3;
  string kernel_version = 4;
  string cloud_hypervisor_version = 5;
  uint32 logical_cpus = 6;
  string cpu_model = 7;
  uint64 total_memory_bytes = 8;
  uint64 available_memory_bytes = 9;
  uint32 vm_count = 10;
  // CPU vendor + curated guest-visible ISA feature flags, used to gate
  // cross-CPU live migration (design M15).
  string cpu_vendor = 11;
  repeated string cpu_features = 12;
}

// ---- VM lifecycle --------------------------------------------------------

// VM identity is always the authoritative UUID (section 23).
message GetVmMetricsRequest { string vm_id = 1; }

// Live per-VM resource metrics (design M15a). CPU/memory are host-observed from
// the VMM process; disk/net are cumulative counters from Cloud Hypervisor.
message VmMetricsResponse {
  bool running = 1;
  double cpu_pct = 2;        // host-observed VMM CPU %, summed across vCPUs
  uint64 mem_bytes = 3;      // VMM resident set size
  uint64 disk_read_bytes = 4;
  uint64 disk_write_bytes = 5;
  uint64 disk_read_ops = 6;
  uint64 disk_write_ops = 7;
  uint64 net_rx_bytes = 8;
  uint64 net_tx_bytes = 9;
  uint64 net_rx_packets = 10;
  uint64 net_tx_packets = 11;
}

message GetVmRequest { string vm_id = 1; }
message GetVmResponse { VmObservedState state = 1; }

message ListVmsRequest {}
message ListVmsResponse { repeated VmObservedState vms = 1; }

message EnsureVmRequest {
  string vm_id = 1;
  // User-friendly VM name (host-local resources are still derived from vm_id).
  string name = 2;
  // Opaque, control-plane-owned desired spec (JSON-encoded orchestration model,
  // translated to Cloud Hypervisor config by the agent — ADR-013).
  bytes spec_json = 3;
  // Resolved per-NIC dataplane bindings, one per network interface in spec
  // order. The control plane allocates MACs and resolves networks to VLANs; the
  // agent owns the privileged TAP/OVS operations (section 18, 30).
  repeated NetworkBinding networks = 4;
  // Optional cloud-init netplan v2 network-config (design M13a). Set when at
  // least one NIC is on a control-plane-managed (static IPAM) network; the agent
  // writes it verbatim into the NoCloud seed so the guest configures its NICs
  // statically instead of via DHCP. Empty ⇒ no network-config (DHCP as before).
  string network_config = 5;
}

message NetworkBinding {
  // Control-allocated guest MAC address (e.g. 02:00:...).
  string mac = 1;
  // 802.1Q VLAN tag on the integration bridge; 0 means untagged/flat.
  uint32 vlan = 2;
  // VXLAN VNI (design M13b); 0 ⇒ not an overlay (use vlan on br-int). When set,
  // the agent places the TAP on a per-VNI overlay bridge instead.
  uint32 vni = 3;
  // Underlay IPs of the *other* hosts, for the full-mesh of VXLAN tunnel ports
  // (only meaningful when vni != 0). The control plane derives these from the
  // peer hosts' endpoints.
  repeated string overlay_peers = 4;
  // Security groups (design M13c): when set, the agent installs a stateful
  // conntrack firewall on this NIC's TAP — default-deny ingress, allow egress,
  // allow established/related — with `ingress_rules` as the allow-list.
  bool filtered = 5;
  repeated SecurityRule ingress_rules = 6;
}

// One resolved ingress allow-rule for a NIC (design M13c). Egress is allowed by
// default in v1, so only ingress rules are sent.
message SecurityRule {
  bool ipv6 = 1;
  // tcp | udp | icmp | any
  string protocol = 2;
  // TCP/UDP destination port range (inclusive); 0/0 means all ports.
  uint32 port_min = 3;
  uint32 port_max = 4;
  // Allowed remote source CIDR; empty means any.
  string remote_cidr = 5;
}

message EnsureVmResponse { VmObservedState state = 1; }

message StartVmRequest { string vm_id = 1; }
message StopVmRequest { string vm_id = 1; }
message DeleteVmRequest { string vm_id = 1; }

message OperationResponse {
  bool accepted = 1;
  string message = 2;
}

message VmObservedState {
  string vm_id = 1;
  Phase phase = 2;
  string message = 3;
  // Guest IP discovered agentlessly via host neighbor snooping (design M11).
  string ip_address = 4;

  enum Phase {
    PHASE_UNSPECIFIED = 0;
    PENDING = 1;
    CREATING = 2;
    STOPPED = 3;
    STARTING = 4;
    RUNNING = 5;
    STOPPING = 6;
    FAILED = 7;
    DELETING = 8;
  }
}
