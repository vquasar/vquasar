# Dependency updates.
#
# The shape here is about keeping the noise low enough that the PRs get read.
# A bot that opens twenty pull requests a week trains everyone to close them
# without looking, which is strictly worse than no bot: the one that mattered
# arrives in the same pile as nineteen that did not.
#
# So: patch and minor updates are grouped into one PR per ecosystem per week,
# because they are the ones you either take all of or none of. Majors come
# separately and individually — a major is a change to how something behaves,
# and it deserves its own diff and its own decision.
#
# Security advisories do not come from this file. They arrive whenever GitHub
# learns of one, provided Dependabot alerts are enabled on the repository, and
# `cargo deny check` in CI fails the build independently of either.

version: 2

updates:
  # ---- Rust ---------------------------------------------------------------
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels: [dependencies, rust]
    commit-message:
      prefix: "deps"
    groups:
      rust-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # The toolchain is pinned in rust-toolchain.toml and moving it is a
      # decision about what the project supports, not a dependency bump.
      - dependency-name: rust-toolchain

  # ---- Web console --------------------------------------------------------
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels: [dependencies, console]
    commit-message:
      prefix: "deps(ui)"
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      # React and its types move together or not at all; a PR that upgrades one
      # and not the other is a type error nobody asked for.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]

  # ---- The pipeline itself ------------------------------------------------
  #
  # Actions are code that runs with this repository's credentials and, in the
  # release workflow, with permission to sign artifacts as this project. They
  # are the dependency most worth keeping current and the one most often
  # forgotten, because nothing about a build failing points at them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
