[package]
name = "vquasar-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Direct client for a single Cloud Hypervisor instance (process + API socket + config translation)."

[dependencies]
vquasar-common.workspace = true
vquasar-model.workspace = true

tokio = { workspace = true, features = ["rt", "net", "io-util", "process", "time", "macros", "sync"] }
async-trait.workspace = true

serde.workspace = true
serde_json.workspace = true

hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true

thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "fs"] }
clap = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

# Milestone 1 end-to-end harness: launches a real cloud-hypervisor and boots a
# VM from a VirtualMachineSpec via the Hypervisor trait.
[[example]]
name = "boot_vm"
path = "examples/boot_vm.rs"
